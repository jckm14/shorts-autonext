name: Build IPA
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build (unsigned)
        run: |
          xcodebuild -project ShortsAutoNext.xcodeproj \
            -target ShortsAutoNext -configuration Release -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            SYMROOT="$PWD/build" build
      - name: Package IPA
        run: |
          mkdir Payload
          cp -R build/Release-iphoneos/ShortsAutoNext.app Payload/
          zip -qry ShortsAutoNext.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ShortsAutoNext-ipa
          path: ShortsAutoNext.ipa
      - name: Publish release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(sed -n 's/.*MARKETING_VERSION = \(.*\);/\1/p' ShortsAutoNext.xcodeproj/project.pbxproj | head -1)
          TAG="v$VERSION"
          NOTES="Unsigned build. Download ShortsAutoNext.ipa and install it with Sideloadly or AltStore. See the README for steps."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ShortsAutoNext.ipa --clobber
          else
            gh release create "$TAG" ShortsAutoNext.ipa --target "$GITHUB_SHA" --title "Shorts Auto-Next $TAG" --notes "$NOTES"
          fi
